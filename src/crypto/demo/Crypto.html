<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cryptocurrency Symbols</title>
    <!-- Include Font Awesome for cryptocurrency icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 20px;
            max-width: 1200px;
        }
        .crypto-card {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            text-align: center;
            transition: transform 0.2s;
        }
        .crypto-card:hover {
            transform: scale(1.05);
        }
        .symbol {
            font-size: 40px;
            color: #333;
            margin-bottom: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 60px;
            height: 60px;
            margin: 0 auto 10px;
            border-radius: 50%;
            background-color: #e0e0e0;
        }
        /* Adjust for Font Awesome icons */
        .symbol i {
            font-size: 30px;
        }
        /* Specific symbol tweaks for better visuals */
        .bitcoin .symbol { color: #f7931a; }
        .ethereum .symbol { color: #627eea; }
        .tether .symbol { color: #26a17b; }
        .ripple .symbol { color: #23292f; }
        .litecoin .symbol { color: #bebebe; }
        .cardano .symbol { color: #0d1e30; }
        .binance .symbol { color: #f3ba2f; }
        .dogecoin .symbol { color: #c2a633; }
        .name {
            font-size: 18px;
            font-weight: bold;
            margin: 0;
            color: #333;
        }
        .code {
            font-size: 14px;
            color: #777;
            margin: 5px 0 0;
        }
        .type {
            font-size: 12px;
            color: #555;
            margin: 5px 0 0;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="crypto-card bitcoin">
            <div class="symbol">₿</div>
       
        </div>
        <div class="crypto-card ethereum">
            <div class="symbol">Ξ</div>
        
        </div>
        <div class="crypto-card tether">
            <div class="symbol">₮</div>
        
        </div>
        <div class="crypto-card ripple">
            <div class="symbol">Ʀ</div>
        
        </div>
        <div class="crypto-card litecoin">
            <div class="symbol">Ł</div>
  
        </div>
        <div class="crypto-card cardano">
            <div class="symbol">₳</div>
 
        </div>
        <div class="crypto-card binance">
            <div class="symbol"><i class="fab fa-btc"></i></div>
         
        </div>
        <div class="crypto-card dogecoin">
            <div class="symbol">Ð</div>
   
        </div>
    </div>
</body>
</html>
